name: Emulator Acceptance

on:
  workflow_dispatch:
  push:
    branches: [ master ]
    paths:
      - 'app/**'
      - 'scripts/**'
      - '.github/workflows/emulator-test.yml'

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Cache debug keystore
        id: keystore-cache
        uses: actions/cache@v4
        with:
          path: debug.keystore
          key: debug-keystore-v1

      - name: Generate debug keystore if missing
        if: steps.keystore-cache.outputs.cache-hit != 'true'
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build APK + instrumented tests
        run: gradle assembleDebug assembleDebugAndroidTest --parallel --build-cache --no-daemon

      - name: Install emulator display deps + start Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y libpulse0 xvfb \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-xinerama0 libxcb-xkb1 libxkbcommon-x11-0 \
            libgl1 libopengl0 libglu1-mesa libxcb-cursor0
          Xvfb :0 -screen 0 1280x2400x24 &
          sleep 2
          xdpyinfo -display :0 | head -2 || true

      - name: Run acceptance on emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          DISPLAY: ':0'
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          profile: pixel_2
          emulator-options: -no-snapshot -noaudio -no-boot-anim -camera-back none -gpu swiftshader_indirect
          script: bash scripts/acceptance.sh

      - name: Upload screenshots & logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-evidence
          path: |
            build/acceptance/*.png
            build/acceptance/*.txt
            build/acceptance/*.check
          if-no-files-found: warn
